<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recette Cuisine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html { font-size: 18px; }
    @media (min-width: 768px) { html { font-size: 20px; } }
    @media (min-width: 1200px) { html { font-size: 24px; } }

    .row { height: auto; }
    @media (min-width: 992px) {
      .row { height: 90vh; }
    }

    .left-half { max-height: none; }
    @media (min-width: 992px) {
      .left-half { max-height: 95vh; }
    }

    .icon { width: 15vw; max-width: 80px; }
    .partie { width: 12vw; max-width: 55px; }

    .list-group-item.etapes {
      white-space: normal;
      word-wrap: break-word;
      text-align: left;
    }

    .badge {
      white-space: normal;
      text-align: left;
    }

    /* Correction du dropdown */
    .dropdown-menu {
      max-height: none !important;
      overflow-y: visible !important;
      position: absolute !important;
    }
    .dropdown-menu .dropdown-item {
      background-color: #0686c7;
      color: white;
    }
    .dropdown-menu .dropdown-item:hover {
      background-color: #006fa5;
      color: white;
    }

    .footer-logo img {
      max-height: 40px;
      max-width: 50vw;
    }
    @media (max-width: 500px) {
      .footer-logo { display: none; }
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Partie gauche -->
      <div class="col-12 col-md-6 left-half d-flex flex-column align-items-center justify-content-center p-3">
        <div class="card shadow-lg w-100 h-100">
          <div class="card-body d-flex flex-column align-items-center justify-content-center">
            <div id="fullscreen-container" class="ratio ratio-16x9 w-100">
              <video id="videoPlayer" class="w-100" controls>
                <source src="video.mp4" type="video/mp4">
                Votre navigateur ne supporte pas la lecture vidéo.
              </video>
            </div>
            <div class="mt-3 d-flex justify-content-center w-100">
              <button id="fullscreen-btn" class="btn btn-primary">Plein écran</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Partie droite -->
      <div class="col-12 col-md-6 right-half d-flex flex-column align-items-center justify-content-center p-3">
        <div class="card shadow-lg w-100 h-100">
          <div class="card-body d-flex flex-column">
            <h4 class="text-center mb-4">Étapes de réalisation</h4>
            <ul class="list-group flex-grow-1 overflow-auto">
              <li class="list-group-item etapes d-flex justify-content-between align-items-center">
                Étape 1 : Préparer les ingrédients
                <span class="badge bg-primary rounded-pill">00:10</span>
              </li>
              <li class="list-group-item etapes d-flex justify-content-between align-items-center">
                Étape 2 : Mélanger les ingrédients
                <span class="badge bg-primary rounded-pill">01:20</span>
              </li>
              <li class="list-group-item etapes d-flex justify-content-between align-items-center">
                Étape 3 : Mettre au four
                <span class="badge bg-primary rounded-pill">02:30</span>
              </li>
            </ul>

            <!-- Menu déroulant -->
            <div class="mt-3">
              <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle w-100" type="button" id="rangeDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                  Choisir un range
                </button>
                <ul class="dropdown-menu w-100" aria-labelledby="rangeDropdown">
                  <li><a class="dropdown-item" href="#">Range 1</a></li>
                  <li><a class="dropdown-item" href="#">Range 2</a></li>
                  <li><a class="dropdown-item" href="#">Range 3</a></li>
                </ul>
              </div>
            </div>

            <!-- Footer logo -->
            <div class="footer-logo mt-4 text-center">
              <img src="logo.png" alt="Logo">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const fullscreenBtn = document.getElementById("fullscreen-btn");
    const videoPlayer = document.getElementById("videoPlayer");

    fullscreenBtn.addEventListener("click", () => {
      console.log("Bouton plein écran cliqué !");
      if (videoPlayer.requestFullscreen) {
        videoPlayer.requestFullscreen();
      } else if (videoPlayer.webkitRequestFullscreen) { // Safari
        videoPlayer.webkitRequestFullscreen();
      } else if (videoPlayer.mozRequestFullScreen) { // Firefox
        videoPlayer.mozRequestFullScreen();
      } else if (videoPlayer.msRequestFullscreen) { // IE/Edge
        videoPlayer.msRequestFullscreen();
      } else {
        console.error("Fullscreen API non supportée");
      }
    });
  </script>
</body>
</html>
