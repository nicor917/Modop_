<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Les Modes Opératoires</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <style> 
    body {
      overflow-x: hidden; 
    }
    html { 
      font-size: 16px; 
    }
    @media (min-width: 768px) {
      html { 
        font-size: 20px; 
      }
    }
    @media (min-width: 1200px) {
      html { 
        font-size: 24px; 
      }
    }
    .left-half {
      background-color: #001f48;
      color: white;
      padding: 1rem;
      min-height: 100vh;
      height: auto;
      overflow-y: auto;
      position: relative;
    }
     .top-label {
      margin: 0;
      padding: 8px 8px;
      display: inline-block;
      color: #ffffff;
      font-weight: bold;
    }
    .custom-dropdown-btn { 
      background-color: #006fa5; 
      color: white; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .custom-dropdown-menu { 
      background-color: #0686c7; 
      color: white; 
    }
    .custom-dropdown-menu .dropdown-item { 
      color: white; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .custom-dropdown-menu .dropdown-item:hover {
      background-color: #006fa5;
    }
    .servo {
      background-color: #1E3459;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .icon { 
      width: 80px; 
      height: auto;
      max-width: 100%;
    }
    .partie { 
      width: 55px; 
      padding: 0%; 
      height: auto;
      max-width: 100%;
    }
    .card-horizontal { 
      display: flex; 
      align-items: center; 
      flex-wrap: wrap;
    }
    .card-horizontal .icon { 
      margin-right: 1rem; 
      flex-shrink: 0;
    }
    .list-group-item.servo {
      background-color: #1E3459;
      border: 1px solid #496791;
      color: white;
    }
    .badge { 
      font-size: 0.85em; 
      padding: 0.4em 0.7em; 
      text-align: left;
      word-break: break-word;
      white-space: normal;
      flex: 1;
    }
    @media (max-width: 768px) {
      .card-horizontal { 
        flex-direction: row; 
        text-align: left; 
      }
      .card-horizontal .icon { 
        margin: 0 1rem 0 0; 
        width: 60px;
      }
    }
    .card-horizontal:hover { 
      background-color: #0686c7; 
    }

    .list-group-item.etapes {
      background-color: #1E3459;
      color: white;
      cursor: pointer;
      white-space: normal;     
      word-wrap: break-word;    
      text-align: left;        
      display: flex;
      align-items: center;
      transition: all 0.2s ease;
    }
    .list-group-item.etapes:hover {
      background-color: #0686c7;
      color: white;
    }

    .container-fluid { 
      padding: 0;
      margin: 0;
    }
    .servo.selected {
      border-left: 5px solid #ffffff;
      background-color: #021f44;
    }
    .etapes.active-step {
      background-color: #124a70;
      border-left: 5px solid #ffffff;
    }
    .step-card {
      background-color: #1E3459;
      color: white;
      overflow-y: auto;
      max-height: 40vh;
      transition: all 0.3s ease;
    }
    .footer-logo {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.3);
      padding: 8px 15px;
      border-radius: 8px;
    }
    .footer-logo img {
      max-height: 60px;
      max-width: 30vw;
      opacity: 0.9;
    }
    @media (max-width: 500px) {
      .footer-logo { 
        display: none; 
      }
    }
    
    .video-container {
      margin-top: 1rem;
      width: 100%;
    }
    
    .step-badge-container {
      display: flex;
      align-items: center;
      width: 100%;
    }
    
    .step-number {
      flex-shrink: 0;
      margin-right: 0.5rem;
    }
    
    .card-content {
      flex: 1;
      min-width: 0;
    }
    
    @media (max-width: 576px) {
      .left-half {
        min-height: auto;
        max-height: none;
      }
      
      .icon {
        width: 60px;
      }
      
      .card-horizontal {
        padding: 0.5rem;
      }
      
      .card-title {
        font-size: 1rem;
      }
      
      .card-text {
        font-size: 0.9rem;
      }
      
      .step-card {
        max-height: 35vh;
      }
      
      .badge {
        font-size: 0.8rem;
      }
    }
    
    @media (max-width: 360px) {
      .icon {
        width: 50px;
      }
      
      .partie {
        width: 40px;
      }
      
      .card-horizontal .icon {
        margin-right: 0.5rem;
      }
    }
    
    .instruction-message {
      text-align: center;
      padding: 2rem;
      color: #8ba3c7;
      font-style: italic;
    }
    
    .servo-steps-container {
      width: 100%;
      margin-top: 0.5rem;
      max-height: 0;
      overflow: hidden;
      border-top: 1px solid transparent;
      padding-top: 0;
      transition: all 0.3s ease;
      opacity: 0;
    }
    
    .servo-steps-container.show {
      max-height: none;
      border-top: 1px solid #496791;
      padding-top: 0.5rem;
      opacity: 1;
    }
    
    .servo-step-item {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      margin-bottom: 0.25rem;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 0.25rem;
      word-break: break-word;
      white-space: normal;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .servo-step-item:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    
    .servo-step-item.active {
      background-color: #0686c7;
    }
    
    .servo-step-number {
      display: inline-block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      text-align: center;
      line-height: 20px;
      margin-right: 0.5rem;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    
    .servo-step-content {
      display: flex;
      align-items: flex-start;
    }
    
    .servo-step-time {
      font-size: 0.65rem;
      color: #8ba3c7;
      margin-left: auto;
      padding-left: 0.5rem;
      flex-shrink: 0;
    }
    
    .toggle-steps-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      transition: transform 0.3s ease;
      margin-left: auto;
    }
    
    .toggle-steps-btn.rotated {
      transform: rotate(180deg);
    }
    
    .toggle-steps-btn:hover {
      color: #cccccc;
    }
    
    .card-header-content {
      display: flex;
      align-items: center;
      width: 100%;
    }
    
    @media (max-width: 768px) {
      .servo-step-item {
        font-size: 0.7rem;
        padding: 0.2rem 0.4rem;
      }
      
      .servo-step-number {
        width: 18px;
        height: 18px;
        line-height: 18px;
        font-size: 0.65rem;
      }
      
      .servo-step-time {
        font-size: 0.6rem;
      }
      
      .toggle-steps-btn {
        font-size: 1rem;
      }
    }

    /* Menu outils - OCCUPE LA MOITIÉ DE LA LARGEUR À GAUCHE */
    .tools-panel {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 50%;
      background-color: #1E3459;
      border: 2px solid #0686c7;
      border-radius: 10px;
      padding: 20px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: none;
      margin: 0 1rem;
      box-sizing: border-box;
    }
    
    .tools-panel.show {
      display: block;
      animation: slideInUp 0.3s ease;
    }
    
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .tools-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #496791;
    }
    
    .tools-title {
      font-weight: bold;
      color: #ffffff;
      margin: 0;
      font-size: 1.1rem;
    }
    
    .close-tools-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tools-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    
    .tool-item {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      display: flex;
      align-items: center;
    }
    
    .tool-icon {
      width: 28px;
      height: 28px;
      margin-right: 12px;
      background-color: #0686c7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    
    .tool-icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    
    .tool-name {
      font-size: 0.95rem;
      color: #ffffff;
    }
    
    @media (max-width: 768px) {
      .tools-panel {
        left: 10px;
        right: 10px;
        width: auto;
        bottom: 10px;
        margin: 0;
      }
      
      .tools-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

          </div>
        </div>
      </div>
    </div>
  </div>

    const dropdownItems = document.querySelectorAll(".dropdown-item");
    const dropdownButton = document.getElementById("dropdownButton");
    const container = document.getElementById("card-container");
    const etapesContainer = document.getElementById("etapes-container");
    const videoPlayer = document.getElementById("video-player");
    const videoSource = document.getElementById("video-source");
    const fullscreenBtn = document.getElementById("fullscreen-btn");
    const fullscreenContainer = document.getElementById("fullscreen-container");
    const toolsPanel = document.getElementById("tools-panel");
    const toolsList = document.getElementById("tools-list");
    const closeToolsBtn = document.getElementById("close-tools-btn");

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function showToolsForStep(tools, stepLabel) {
      const toolsTitle = toolsPanel.querySelector('.tools-title');
      toolsTitle.textContent = `Outils pour: ${stepLabel}`;
      
      toolsList.innerHTML = '';
      
      tools.forEach(tool => {
        const toolItem = document.createElement('li');
        toolItem.className = 'tool-item';
        
        let iconHTML;
        if (tool.icon) {
          // Si l'outil a une icône personnalisée
          iconHTML = `<div class="tool-icon"><img class="tool-icon-img" src="${tool.icon}" alt="${tool.name}"></div>`;
        } else {
          // Icône par défaut si aucune image n'est spécifiée
          iconHTML = `<div class="tool-icon">🛠️</div>`;
        }
        
        toolItem.innerHTML = `
          ${iconHTML}
          <span class="tool-name">${tool.name || tool}</span>
        `;
        toolsList.appendChild(toolItem);
      });
      
      toolsPanel.classList.add('show');
    }

    function hideToolsPanel() {
      toolsPanel.classList.remove('show');
    }

    function updateCards(range) {
      const instructionMessage = document.querySelector('.instruction-message');
      if (instructionMessage) {
        instructionMessage.remove();
      }
      
      container.innerHTML = "";
      data[range]?.forEach((card, index) => {
        const cardHTML = `
          <div class="card m-2 m-md-3 servo" data-index="${index}" data-range="${range}">
            <div class="card-body p-2">
              <div class="card-header-content">
                <div class="d-flex align-items-center flex-grow-1">
                  <img class="icon" src="${card.img}" alt="${card.title}">
                  <div class="card-content ms-2">
                    <h5 class="card-title m-1">${card.title}</h5>
                    <p class="card-text mb-0">${card.text}</p>
                  </div>
                </div>
                <button class="toggle-steps-btn" type="button">
                  ▼
                </button>
              </div>
              <div class="servo-steps-container">
                ${card.steps.map((step, idx) => `
                  <div class="servo-step-item" data-time="${step.time}" data-tools='${JSON.stringify(step.tools)}' data-label="${step.label}">
                    <div class="servo-step-content">
                      <span class="servo-step-number">${idx + 1}</span>
                      <span class="servo-step-label">${step.label}</span>
                      <span class="servo-step-time">${formatTime(step.time)}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>`;
        container.insertAdjacentHTML("beforeend", cardHTML);
      });
      attachCardEvents(range);
    }

    function attachCardEvents(range) {
      document.querySelectorAll(".servo").forEach(card => {
        const toggleBtn = card.querySelector('.toggle-steps-btn');
        const stepsContainer = card.querySelector('.servo-steps-container');
        const stepItems = card.querySelectorAll('.servo-step-item');
        
        toggleBtn.addEventListener('click', function(e) {
          e.stopPropagation(); 
          stepsContainer.classList.toggle('show');
          this.classList.toggle('rotated');
        });
        
        stepItems.forEach(stepItem => {
          stepItem.addEventListener('click', function(e) {
            e.stopPropagation(); 
            
            stepItems.forEach(item => item.classList.remove('active'));
            this.classList.add('active');
            
            const time = parseFloat(this.getAttribute('data-time'));
            const tools = JSON.parse(this.getAttribute('data-tools'));
            const stepLabel = this.getAttribute('data-label');
            
            videoPlayer.currentTime = time;
            videoPlayer.play();
            
            showToolsForStep(tools, stepLabel);
            
            updateRightPanelSelection(time);
          });
        });
        
        card.addEventListener("click", (e) => {
          if (e.target.closest('.toggle-steps-btn') || e.target.closest('.servo-step-item')) {
            return;
          }
          
          document.querySelectorAll(".servo").forEach(c => c.classList.remove("selected"));
          card.classList.add("selected");

          const index = card.getAttribute("data-index");
          const item = data[range][index];

          videoSource.src = item.video;
          videoPlayer.load();
          videoPlayer.play();

          updateRightPanel(item.steps);
        });
      });
    }

    function updateRightPanel(steps) {
      etapesContainer.innerHTML = "";
      steps.forEach((step, idx) => {
        const stepElement = document.createElement("div");
        stepElement.className = "list-group-item etapes d-flex justify-content-start align-items-center py-2 mb-2";
        stepElement.innerHTML = `
          <div class="step-badge-container">
            <span class="step-number"><img class="partie" src="HMTL_JS/icons/${idx + 1}.png" alt="Étape ${idx + 1}"></span>
            <span class="badge bg-none">${step.label}</span>
          </div>
        `;
        stepElement.addEventListener("click", () => {
          document.querySelectorAll(".etapes").forEach(el => el.classList.remove("active-step"));
          stepElement.classList.add("active-step");
          videoPlayer.currentTime = step.time;
          videoPlayer.play();
          
          showToolsForStep(step.tools, step.label);
        });
        etapesContainer.appendChild(stepElement);
      });
    }

    function updateRightPanelSelection(time) {
      document.querySelectorAll(".etapes").forEach((el, idx) => {
        el.classList.remove("active-step");
      });
    }

    dropdownItems.forEach(item => {
      item.addEventListener("click", (e) => {
        e.preventDefault();
        const selected = item.textContent.trim();
        dropdownButton.textContent = selected;
        updateCards(selected);
      });
    });

    fullscreenBtn.addEventListener("click", () => {
      if (fullscreenContainer.requestFullscreen) {
        fullscreenContainer.requestFullscreen();
      } else if (fullscreenContainer.webkitRequestFullscreen) {
        fullscreenContainer.webkitRequestFullscreen();
      } else if (fullscreenContainer.mozRequestFullScreen) {
        fullscreenContainer.mozRequestFullScreen();
      } else if (fullscreenContainer.msRequestFullscreen) {
        fullscreenContainer.msRequestFullscreen();
      }
    });

    closeToolsBtn.addEventListener("click", hideToolsPanel);

    function isFullscreen() {
      return document.fullscreenElement === fullscreenContainer
        || document.webkitFullscreenElement === fullscreenContainer
        || document.mozFullScreenElement === fullscreenContainer
        || document.msFullscreenElement === fullscreenContainer;
    }

    function toggleStepCardFullscreen() {
      const stepCard = document.querySelector('.step-card');
      const paused = videoPlayer.paused;
      if (isFullscreen() && paused) {
        stepCard.style.position = 'absolute';
        stepCard.style.bottom = '10px';
        stepCard.style.left = '10px';
        stepCard.style.right = '10px';
        stepCard.style.maxHeight = '40vh';
        stepCard.style.backgroundColor = 'rgba(30, 52, 89, 0.85)';
        stepCard.style.zIndex = '9999';
      } else {
        stepCard.style = '';
      }
    }

    videoPlayer.addEventListener('pause', toggleStepCardFullscreen);
    videoPlayer.addEventListener('play', toggleStepCardFullscreen);
    document.addEventListener('fullscreenchange', toggleStepCardFullscreen);
  </script>
