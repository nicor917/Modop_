# Code HTML complet commenté — Les Modes Opératoires

```html
<!DOCTYPE html>
<html lang="fr">
<head>

  <!-- ========================= -->
  <!-- MÉTADONNÉES DE LA PAGE -->
  <!-- ========================= -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Les Modes Opératoires</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    /* ========================= */
    /* STYLE GÉNÉRAL DE LA PAGE */
    /* ========================= */

    body {
      overflow-x: hidden;
      background-color: #0b1730;
      color: white;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    html {
      font-size: 16px;
    }

    /* Taille responsive */
    @media (min-width: 768px) {
      html {
        font-size: 20px;
      }
    }

    @media (min-width: 1200px) {
      html {
        font-size: 24px;
      }
    }

    /* ========================= */
    /* COLONNE GAUCHE */
    /* ========================= */

    .left-half {
      background-color: #001f48;
      padding: 1rem;
      min-height: 100vh;
      overflow-y: auto;
    }

    /* ========================= */
    /* COLONNE DROITE */
    /* ========================= */

    .right-half {
      background-color: #102544;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Titre principal */
    .top-label {
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
    }

    /* ========================= */
    /* DROPDOWN */
    /* ========================= */

    .custom-dropdown-btn {
      background-color: #006fa5;
      color: white;
      border: none;
      width: 100%;
    }

    .custom-dropdown-menu {
      background-color: #0686c7;
      width: 100%;
    }

    .custom-dropdown-menu .dropdown-item {
      color: white;
    }

    .custom-dropdown-menu .dropdown-item:hover {
      background-color: #005b87;
    }

    /* ========================= */
    /* CARTE SERVOMOTEUR */
    /* ========================= */

    .servo {
      background-color: #1E3459;
      border: 1px solid #496791;
      color: white;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .servo:hover {
      background-color: #0686c7;
    }

    /* Carte sélectionnée */
    .servo.selected {
      border-left: 5px solid white;
      background-color: #021f44;
    }

    /* Image du servomoteur */
    .icon {
      width: 80px;
      max-width: 100%;
    }

    /* Icône étape */
    .partie {
      width: 45px;
    }

    /* ========================= */
    /* CARTE ÉTAPES */
    /* ========================= */

    .step-card {
      background-color: #1E3459;
      color: white;
      margin: 1rem;
      border-radius: 10px;
      max-height: 40vh;
      overflow-y: auto;
    }

    .list-group-item.etapes {
      background-color: #1E3459;
      border: 1px solid #496791;
      color: white;
      cursor: pointer;
      transition: 0.2s ease;
      margin-bottom: 8px;
    }

    .list-group-item.etapes:hover {
      background-color: #0686c7;
    }

    /* Étape active */
    .etapes.active-step {
      background-color: #124a70;
      border-left: 5px solid white;
    }

    /* Message affiché avant sélection */
    .instruction-message {
      text-align: center;
      padding: 2rem;
      color: #8ba3c7;
      font-style: italic;
    }

    /* ========================= */
    /* ÉTAPES DANS LA CARTE */
    /* ========================= */

    .servo-steps-container {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: all 0.3s ease;
    }

    /* Affichage des étapes */
    .servo-steps-container.show {
      max-height: 500px;
      opacity: 1;
    }

    .servo-step-item {
      background-color: rgba(255,255,255,0.1);
      padding: 0.5rem;
      border-radius: 5px;
      margin-bottom: 0.3rem;
      cursor: pointer;
    }

    .servo-step-item:hover {
      background-color: rgba(255,255,255,0.2);
    }

    /* Bouton ouvrir/fermer étapes */
    .toggle-steps-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* ========================= */
    /* VIDÉO */
    /* ========================= */

    .video-container {
      padding: 1rem;
    }

    /* ========================= */
    /* LOGO BAS DE PAGE */
    /* ========================= */

    .footer-logo {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(255,255,255,0.2);
      padding: 10px;
      border-radius: 10px;
      z-index: 1000;
    }

    .footer-logo img {
      max-height: 60px;
    }

    /* ========================= */
    /* PANEL OUTILS */
    /* ========================= */

    .tools-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 45%;
      background-color: #1E3459;
      border: 2px solid #0686c7;
      border-radius: 10px;
      padding: 20px;
      z-index: 1000;
      display: none;
    }

    /* Affichage panel outils */
    .tools-panel.show {
      display: block;
    }

    .tools-list {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .tool-item {
      background-color: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 5px;
      display: flex;
      align-items: center;
    }

    .tool-icon-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      margin-right: 10px;
    }

  </style>
</head>

<body>

<!-- ========================= -->
<!-- CONTENEUR PRINCIPAL -->
<!-- ========================= -->

<div class="container-fluid p-2">

  <div class="row g-3">

    <!-- ========================= -->
    <!-- PARTIE GAUCHE -->
    <!-- ========================= -->

    <div class="col-12 col-md-6 left-half">

      <!-- Titre -->
      <p class="top-label">Les Modes Opératoires</p>

      <!-- ========================= -->
      <!-- MENU DÉROULANT -->
      <!-- ========================= -->

      <div class="dropdown mt-3">

        <button id="dropdownButton"
                class="btn custom-dropdown-btn dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown">
          SÉLECTIONNEZ UNE GAMME
        </button>

        <!-- Liste des gammes -->
        <ul class="dropdown-menu custom-dropdown-menu">
          <li><a class="dropdown-item" href="#">BT-RANGE</a></li>
          <li><a class="dropdown-item" href="#">ST-RANGE</a></li>
          <li><a class="dropdown-item" href="#">AQ-RANGE</a></li>
          <li><a class="dropdown-item" href="#">L-RANGE</a></li>
        </ul>

      </div>

      <!-- ========================= -->
      <!-- CARTES SERVOMOTEURS -->
      <!-- ========================= -->

      <div id="card-container" class="mt-3">

        <!-- Message par défaut -->
        <div class="instruction-message">
          Veuillez sélectionner une gamme.
        </div>

      </div>

      <!-- ========================= -->
      <!-- PANEL OUTILS -->
      <!-- ========================= -->

      <div id="tools-panel" class="tools-panel">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="m-0">Outils nécessaires</h5>
          <button id="close-tools-btn" class="btn btn-danger btn-sm">X</button>
        </div>

        <ul id="tools-list" class="tools-list"></ul>

      </div>

    </div>

    <!-- ========================= -->
    <!-- PARTIE DROITE -->
    <!-- ========================= -->

    <div class="col-12 col-md-6 right-half">

      <div class="video-container">

        <!-- Vidéo -->
        <div class="ratio ratio-16x9">
          <video id="video-player" controls>
            <source id="video-source" src="" type="video/mp4">
          </video>
        </div>

        <!-- ========================= -->
        <!-- LISTE DES ÉTAPES -->
        <!-- ========================= -->

        <div class="step-card card mt-3">

          <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5>Les étapes de réalisation</h5>

              <!-- Bouton plein écran -->
              <button id="fullscreen-btn"
                      class="btn btn-outline-light btn-sm">
                Plein écran
              </button>
            </div>

            <!-- Conteneur des étapes -->
            <div id="etapes-container" class="list-group"></div>

          </div>

        </div>

      </div>

    </div>

  </div>
</div>

<!-- ========================= -->
<!-- LOGO -->
<!-- ========================= -->

<div class="footer-logo">
  <img src="HMTL_JS/icons/logo_bc.png" alt="Logo">
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* ========================= */
/* DONNÉES DES SERVOMOTEURS */
/* ========================= */

const data = {

  "BT-RANGE": [

    {
      title: "BT6L",
      text: "Remontage",
      img: "HMTL_JS/img/bt/BT7-V.png",
      video: "attente_v2.mp4",

      steps: [

        {
          label: "Préparation",
          time: 5,

          tools: [
            {
              name: "Tournevis cruciforme",
              icon: "HMTL_JS/icons/tools/screwdriver.png"
            }
          ]
        },

        {
          label: "Assemblage",
          time: 15,

          tools: [
            {
              name: "Clé Allen",
              icon: "HMTL_JS/icons/tools/hex_key.png"
            }
          ]
        }

      ]
    }
  ]
};

/* ========================= */
/* SÉLECTION DES ÉLÉMENTS HTML */
/* ========================= */

const dropdownItems = document.querySelectorAll('.dropdown-item');
const dropdownButton = document.getElementById('dropdownButton');
const container = document.getElementById('card-container');
const etapesContainer = document.getElementById('etapes-container');
const videoPlayer = document.getElementById('video-player');
const videoSource = document.getElementById('video-source');
const toolsPanel = document.getElementById('tools-panel');
const toolsList = document.getElementById('tools-list');
const closeToolsBtn = document.getElementById('close-tools-btn');
const fullscreenBtn = document.getElementById('fullscreen-btn');

/* ========================= */
/* FORMATAGE DU TEMPS */
/* ========================= */

function formatTime(seconds) {

  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

/* ========================= */
/* AFFICHAGE DES OUTILS */
/* ========================= */

function showToolsForStep(tools) {

  toolsList.innerHTML = '';

  tools.forEach(tool => {

    const li = document.createElement('li');
    li.className = 'tool-item';

    li.innerHTML = `
      <img class="tool-icon-img" src="${tool.icon}" alt="${tool.name}">
      <span>${tool.name}</span>
    `;

    toolsList.appendChild(li);
  });

  toolsPanel.classList.add('show');
}

/* Fermeture panel outils */
closeToolsBtn.addEventListener('click', () => {
  toolsPanel.classList.remove('show');
});

/* ========================= */
/* MISE À JOUR DES ÉTAPES */
/* ========================= */

function updateRightPanel(steps) {

  etapesContainer.innerHTML = '';

  steps.forEach((step, index) => {

    const div = document.createElement('div');
    div.className = 'list-group-item etapes';

    div.innerHTML = `
      <div class="d-flex align-items-center">

        <img class="partie me-2"
             src="HMTL_JS/icons/${index + 1}.png">

        <div>
          <strong>${step.label}</strong><br>
          <small>${formatTime(step.time)}</small>
        </div>

      </div>
    `;

    /* Clic sur une étape */
    div.addEventListener('click', () => {

      document.querySelectorAll('.etapes').forEach(el => {
        el.classList.remove('active-step');
      });

      div.classList.add('active-step');

      /* Aller à la bonne seconde vidéo */
      videoPlayer.currentTime = step.time;
      videoPlayer.play();

      /* Afficher les outils */
      showToolsForStep(step.tools);
    });

    etapesContainer.appendChild(div);
  });
}

/* ========================= */
/* ÉVÉNEMENTS DES CARTES */
/* ========================= */

function attachCardEvents(range) {

  document.querySelectorAll('.servo').forEach(card => {

    const toggleBtn = card.querySelector('.toggle-steps-btn');
    const stepsContainer = card.querySelector('.servo-steps-container');

    /* Ouvrir/Fermer les étapes */
    toggleBtn.addEventListener('click', (e) => {

      e.stopPropagation();

      stepsContainer.classList.toggle('show');
    });

    /* Sélection d'une carte */
    card.addEventListener('click', () => {

      document.querySelectorAll('.servo').forEach(c => {
        c.classList.remove('selected');
      });

      card.classList.add('selected');

      const index = card.getAttribute('data-index');
      const item = data[range][index];

      /* Chargement vidéo */
      videoSource.src = item.video;

      videoPlayer.load();
      videoPlayer.play();

      /* Mise à jour étapes */
      updateRightPanel(item.steps);
    });
  });
}

/* ========================= */
/* AFFICHAGE DES CARTES */
/* ========================= */

function updateCards(range) {

  container.innerHTML = '';

  data[range].forEach((card, index) => {

    const cardHTML = `

      <div class="card servo m-2"
           data-index="${index}">

        <div class="card-body">

          <div class="d-flex justify-content-between align-items-center">

            <div class="d-flex align-items-center">

              <img class="icon me-3"
                   src="${card.img}">

              <div>
                <h5>${card.title}</h5>
                <p class="mb-0">${card.text}</p>
              </div>

            </div>

            <button class="toggle-steps-btn">▼</button>

          </div>

          <!-- Étapes -->
          <div class="servo-steps-container mt-3">

            ${card.steps.map((step, idx) => `

              <div class="servo-step-item">
                ${idx + 1}. ${step.label}
                <span class="float-end">${formatTime(step.time)}</span>
              </div>

            `).join('')}

          </div>

        </div>

      </div>

    `;

    container.insertAdjacentHTML('beforeend', cardHTML);
  });

  /* Activation événements */
  attachCardEvents(range);
}

/* ========================= */
/* MENU DÉROULANT */
/* ========================= */

dropdownItems.forEach(item => {

  item.addEventListener('click', (e) => {

    e.preventDefault();

    const selected = item.textContent.trim();

    dropdownButton.textContent = selected;

    updateCards(selected);
  });
});

/* ========================= */
/* PLEIN ÉCRAN VIDÉO */
/* ========================= */

fullscreenBtn.addEventListener('click', () => {

  const video = document.getElementById('video-player');

  if (video.requestFullscreen) {
    video.requestFullscreen();
  }
});

</script>

</body>
</html>
