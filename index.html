<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Les Modes Opératoires</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <style> 
    body {
      overflow-x: hidden; 
    }
    html { 
      font-size: 16px; 
    }
    @media (min-width: 768px) {
      html { 
        font-size: 20px; 
      }
    }
    @media (min-width: 1200px) {
      html { 
        font-size: 24px; 
      }
    }
    .left-half {
      background-color: #001f48;
      color: white;
      padding: 1rem;
      min-height: 100vh;
      height: auto;
      overflow-y: auto;
    }
    .top-label {
      background-color: #496791;
      margin: 0;
      padding: 4px 8px;
      display: inline-block;
    }
    .custom-dropdown-btn { 
      background-color: #006fa5; 
      color: white; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .custom-dropdown-menu { 
      background-color: #0686c7; 
      color: white; 
    }
    .custom-dropdown-menu .dropdown-item { 
      color: white; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .custom-dropdown-menu .dropdown-item:hover {
      background-color: #006fa5;
    }
    .servo {
      background-color: #1E3459;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .icon { 
      width: 80px; 
      height: auto;
      max-width: 100%;
    }
    .partie { 
      width: 55px; 
      padding: 0%; 
      height: auto;
      max-width: 100%;
    }
    .card-horizontal { 
      display: flex; 
      align-items: center; 
      flex-wrap: wrap;
    }
    .card-horizontal .icon { 
      margin-right: 1rem; 
      flex-shrink: 0;
    }
    .list-group-item.servo {
      background-color: #1E3459;
      border: 1px solid #496791;
      color: white;
    }
    .badge { 
      font-size: 0.85em; 
      padding: 0.4em 0.7em; 
      text-align: left;
      word-break: break-word;
      white-space: normal;
      flex: 1;
    }
    @media (max-width: 768px) {
      .card-horizontal { 
        flex-direction: row; 
        text-align: left; 
      }
      .card-horizontal .icon { 
        margin: 0 1rem 0 0; 
        width: 60px;
      }
    }
    .card-horizontal:hover { 
      background-color: #0686c7; 
    }

    .list-group-item.etapes {
      background-color: #1E3459;
      color: white;
      cursor: pointer;
      white-space: normal;     
      word-wrap: break-word;    
      text-align: left;        
      display: flex;
      align-items: center;
      transition: all 0.2s ease;
    }
    .list-group-item.etapes:hover {
      background-color: #0686c7;
      color: white;
    }

    .container-fluid { 
      padding: 0;
      margin: 0;
    }
    .servo.selected {
      border-left: 5px solid #ffffff;
      background-color: #124a70;
    }
    .etapes.active-step {
      background-color: #124a70;
      border-left: 5px solid #ffffff;
    }
    .step-card {
      background-color: #1E3459;
      color: white;
      overflow-y: auto;
      max-height: 40vh;
      transition: all 0.3s ease;
    }
    .footer-logo {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.3); /* Fond blanc à 30% d'opacité */
      padding: 8px 15px;
      border-radius: 8px;
    }
    .footer-logo img {
      max-height: 60px;
      max-width: 30vw;
      opacity: 0.9;
    }
    @media (max-width: 500px) {
      .footer-logo { 
        display: none; 
      }
    }
    
    /* Améliorations pour le responsive */
    .video-container {
      margin-top: 1rem;
      width: 100%;
    }
    
    .step-badge-container {
      display: flex;
      align-items: center;
      width: 100%;
    }
    
    .step-number {
      flex-shrink: 0;
      margin-right: 0.5rem;
    }
    
    .card-content {
      flex: 1;
      min-width: 0; /* Permet au texte de bien s'adapter */
    }
    
    @media (max-width: 576px) {
      .left-half {
        min-height: auto;
        max-height: none;
      }
      
      .icon {
        width: 60px;
      }
      
      .card-horizontal {
        padding: 0.5rem;
      }
      
      .card-title {
        font-size: 1rem;
      }
      
      .card-text {
        font-size: 0.9rem;
      }
      
      .step-card {
        max-height: 35vh;
      }
      
      .badge {
        font-size: 0.8rem;
      }
    }
    
    /* Pour les très petits écrans */
    @media (max-width: 360px) {
      .icon {
        width: 50px;
      }
      
      .partie {
        width: 40px;
      }
      
      .card-horizontal .icon {
        margin-right: 0.5rem;
      }
    }
    
    /* Message d'instruction */
    .instruction-message {
      text-align: center;
      padding: 2rem;
      color: #8ba3c7;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container-fluid m-0 p-2 p-md-3">
    <div class="row g-0 g-md-3">
      <div class="col-12 col-md-6 left-half">
        <p class="top-label">Les Modes Opératoires</p>
        <div class="dropdown mt-3 w-100">
          <button id="dropdownButton" class="btn custom-dropdown-btn dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            SÉLECTIONNEZ UNE GAMME
          </button>
          <ul class="dropdown-menu custom-dropdown-menu w-100">
            <li><a class="dropdown-item" href="#">BT-RANGE</a></li>
            <li><a class="dropdown-item" href="#">ST-RANGE</a></li>
            <li><a class="dropdown-item" href="#">AQ-RANGE</a></li>
            <li><a class="dropdown-item" href="#">L-RANGE</a></li>
            <li><a class="dropdown-item" href="#">SN-RANGE</a></li>
            <li><a class="dropdown-item" hrzf="#">DR-RANGE</a></li>
          </ul>
        </div>
        <div id="card-container" class="mt-3">
          <div class="instruction-message">
            Veuillez sélectionner une gamme pour afficher les servomoteurs disponibles.
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="container mt-2 mt-md-0 p-0 p-md-2" id="fullscreen-container">
          <div class="ratio ratio-16x9 video-container">
            <video id="video-player" controls class="w-100">
              <source id="video-source" src="" type="video/mp4">
              Votre navigateur ne supporte pas la balise vidéo.
            </video>
          </div>
          <div class="card m-1 m-md-3 step-card">
            <div class="card-body p-2 p-md-3">
              <div class="d-flex align-items-center justify-content-between mb-2 mb-md-3">
                <h5 class="card-title mb-0 d-flex align-items-center">
                  <img class="icon me-2" src="HMTL_JS/icons/footstep.png" alt="Étapes">
                  <span class="d-none d-md-inline">Les Étapes de Réalisations</span>
                  <span class="d-md-none">Étapes</span>
                </h5>
                <button id="fullscreen-btn" class="btn btn-outline-light btn-sm ms-3">Plein écran</button>
              </div>
              <div class="list-group list-group-flush" id="etapes-container"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const data = {
      "BT-RANGE": [
        { title: "BT6L", text: "Remontage", img: "HMTL_JS/img/bt/BT7-V.png", video: "attente_v2.mp4", steps: [ { label: "À définir", time: 5 }, { label: "À définir", time: 15 }, { label: "À définir", time: 30 } ] },
        { title: "BT6", text: "Démontage", img: "HMTL_JS/img/bt/btlogic.png", video: "attente_v2.mp4", steps: [ { label: "À définir", time: 5 }, { label: "À définir", time: 15 }, { label: "À définir", time: 30 } ] }
      ],
      "ST-RANGE": [
        { title: "ST14K3", text: "Démontage", img: "HMTL_JS/img/st/st14k3.jpg", video: "Demontage_ST14K3.mp4", steps: [ { label: "Préparation de démontage des éléments externes", time: 10 }, { label: "Déconnexion des composants internes", time: 134 }, { label: "Démontage mécanique du carter", time: 185 }, { label: "Retirer et rebuter la vis prise de mouvement et la clavette", time: 270 } ] },
        { title: "ST14K3", text: "Remontage", img: "HMTL_JS/img/st/st14k3.jpg", video: "remontage_st14k3.mp4", steps: [ { label: "Assemblage des organes de transmission", time: 14 }, { label: "Remontage du carter et de l'étanchéité", time: 122 }, { label: "Remontage de la platine et des pignons", time: 210 }, { label: "Finalisation et verification", time: 350 } ] }
      ],
      "L-RANGE": [
        { title: "100L", text: "Démontage", img: "HMTL_JS/img/L/100LL.png", video: "demontage_100l.mp4", steps: [ { label: "Démontage du servomoteur", time: 8 }, { label: "Démontage de l'ensemble compte-tours", time: 89 }, { label: "Démontage du palier", time: 180 }, { label: "Démontage du limiteur et des rondelles du limiteur", time: 332 } ] },
        { title: "100L", text: "Remontage", img: "HMTL_JS/img/L/100LL.png", video: "remontage_100L.mp4", steps: [ { label: "Remontage de l'ensemble limiteur d'effort", time: 11 }, { label: "Remontage de l'ensemble compte-tours", time: 106 }, { label: "Remontage de l'ensemble roue tangente/vis sans fin", time: 162 }, { label: "Remontage du palier", time: 224 }, { label: "Repose de l'ensemble asservissement", time: 282 }, { label: "Repose de l'ensemble compte-tours", time: 332 }, { label: "ESSAIS DE DEBRAYAGE DU SERVOMOTEUR", time: 392 }, { label: "Repose du moteur", time: 408 } ] }
      ],
      "SN-RANGE": [
        { title: "SN-14", text: "Démontage", img: "sn14.png", video: "demontage_sn14.mp4", steps: [ { label: "Dépose du moteur", time: 13 }, { label: "Dépose des connecteurs", time: 75 }, { label: "Dépose du boîtier de commande", time: 112 }, { label: "Dépose du bornier", time: 151 }, { label: "Dépose de la ligne d'arbre", time: 201 }, { label: "Dépose de la prise de mouvement", time: 293 }, { label: "Dépose de la vis sans fin", time: 353 }, { label: "Démontage de la ligne d'arbre", time: 381 } ] },
        { title: "SN-14", text: "Remontage", img: "sn14.png", video: "remontage_sn14.mp4", steps: [ { label: "Préparation de la ligne d'arbre", time: 13 }, { label: "Assemblage de la ligne d'arbre dans le carter", time: 125 }, { label: "Remontage des orgnanes périphéiques et graissage", time: 222 }, { label: "Fermeture et raccordement du moteur", time: 316 }] }
      ],
      "AQ-RANGE": [
        { title: "AQ 3", text: "Démontage", img: "HMTL_JS/img/aq/aq3.png", video: "attente_v2.mp4", steps: [ { label: "À définir", time: 5 }, { label: "À définir", time: 20 } ] },
        { title: "AQ 10", text: "Démontage", img: "HMTL_JS/img/aq/aq10.png", video: "attente_v2.mp4", steps: [ { label: "À définir", time: 5 }, { label: "À définir", time: 25 } ] }
      ],
      "DR-RANGE": [
        { title: "DR5", text: "Démontage", img: "HMTL_JS/img/aq/aq3.png", video: "demontage_sn14.mp4", steps: [ { label: "À définir", time: 5 }, { label: "À définir", time: 20 } ] },
        { title: "DR5", text: "Remontage", img: "HMTL_JS/img/aq/aq10.png", video: "attente_v2.mp4", steps: [ { label: "À définir", time: 5 }, { label: "À définir", time: 25 } ] }
      ]
    };

    const dropdownItems = document.querySelectorAll(".dropdown-item");
    const dropdownButton = document.getElementById("dropdownButton");
    const container = document.getElementById("card-container");
    const etapesContainer = document.getElementById("etapes-container");
    const videoPlayer = document.getElementById("video-player");
    const videoSource = document.getElementById("video-source");
    const fullscreenBtn = document.getElementById("fullscreen-btn");
    const fullscreenContainer = document.getElementById("fullscreen-container");

    function updateCards(range) {
      // Supprimer le message d'instruction
      const instructionMessage = document.querySelector('.instruction-message');
      if (instructionMessage) {
        instructionMessage.remove();
      }
      
      container.innerHTML = "";
      data[range]?.forEach((card, index) => {
        const cardHTML = `
          <div class="card m-2 m-md-3 servo" data-index="${index}" data-range="${range}">
            <div class="card-body card-horizontal p-2">
              <img class="icon" src="${card.img}" alt="${card.title}">
              <div class="card-content">
                <h5 class="card-title m-1">${card.title}</h5>
                <p class="card-text mb-0">${card.text}</p>
              </div>
            </div>
          </div>`;
        container.insertAdjacentHTML("beforeend", cardHTML);
      });
      attachCardEvents(range);
    }

    function attachCardEvents(range) {
      document.querySelectorAll(".servo").forEach(card => {
        card.addEventListener("click", () => {
          document.querySelectorAll(".servo").forEach(c => c.classList.remove("selected"));
          card.classList.add("selected");

          const index = card.getAttribute("data-index");
          const item = data[range][index];

          videoSource.src = item.video;
          videoPlayer.load();
          videoPlayer.play();

          etapesContainer.innerHTML = "";
          item.steps.forEach((step, idx) => {
            const stepElement = document.createElement("div");
            stepElement.className = "list-group-item etapes d-flex justify-content-start align-items-center py-2 mb-2";
            stepElement.innerHTML = `
              <div class="step-badge-container">
                <span class="step-number"><img class="partie" src="HMTL_JS/icons/${idx + 1}.png" alt="Étape ${idx + 1}"></span>
                <span class="badge bg-none">${step.label}</span>
              </div>
            `;
            stepElement.addEventListener("click", () => {
              document.querySelectorAll(".etapes").forEach(el => el.classList.remove("active-step"));
              stepElement.classList.add("active-step");
              videoPlayer.currentTime = step.time;
              videoPlayer.play();
            });
            etapesContainer.appendChild(stepElement);
          });
        });
      });
    }

    dropdownItems.forEach(item => {
      item.addEventListener("click", (e) => {
        e.preventDefault();
        const selected = item.textContent.trim();
        dropdownButton.textContent = selected;
        updateCards(selected);
      });
    });

    fullscreenBtn.addEventListener("click", () => {
      if (fullscreenContainer.requestFullscreen) {
        fullscreenContainer.requestFullscreen();
      } else if (fullscreenContainer.webkitRequestFullscreen) {
        fullscreenContainer.webkitRequestFullscreen();
      } else if (fullscreenContainer.mozRequestFullScreen) {
        fullscreenContainer.mozRequestFullScreen();
      } else if (fullscreenContainer.msRequestFullscreen) {
        fullscreenContainer.msRequestFullscreen();
      }
    });

    function isFullscreen() {
      return document.fullscreenElement === fullscreenContainer
        || document.webkitFullscreenElement === fullscreenContainer
        || document.mozFullScreenElement === fullscreenContainer
        || document.msFullscreenElement === fullscreenContainer;
    }

    function toggleStepCardFullscreen() {
      const stepCard = document.querySelector('.step-card');
      const paused = videoPlayer.paused;
      if (isFullscreen() && paused) {
        stepCard.style.position = 'absolute';
        stepCard.style.bottom = '10px';
        stepCard.style.left = '10px';
        stepCard.style.right = '10px';
        stepCard.style.maxHeight = '40vh';
        stepCard.style.backgroundColor = 'rgba(30, 52, 89, 0.85)';
        stepCard.style.zIndex = '9999';
      } else {
        stepCard.style = '';
      }
    }

    videoPlayer.addEventListener('pause', toggleStepCardFullscreen);
    videoPlayer.addEventListener('play', toggleStepCardFullscreen);
    document.addEventListener('fullscreenchange', toggleStepCardFullscreen);
  </script>

  <div class="footer-logo">
    <img src="HMTL_JS/icons/logo_bc.png" alt="Logo" />
  </div>
</body>
</html>
