<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- ==================== MÉTA-DONNÉES ==================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Les Modes Opératoires</title>
  <!-- Chargement de Bootstrap 5 (CSS) depuis CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- ==================== STYLES PERSONNALISÉS ==================== -->
  <style> 
    /* --- Global --- */
    body {
      overflow-x: hidden;      /* Évite le défilement horizontal inutile */
    }
    html { 
      font-size: 16px;        /* Taille de base pour les rem (adaptative) */
    }
    /* Ajustement de la taille de police pour les tablettes */
    @media (min-width: 768px) {
      html { 
        font-size: 20px; 
      }
    }
    /* Ajustement pour les grands écrans */
    @media (min-width: 1200px) {
      html { 
        font-size: 24px; 
      }
    }

    /* --- Colonne gauche (liste des gammes et servos) --- */
    .left-half {
      background-color: #001f48;  /* Bleu foncé institutionnel */
      color: white;
      padding: 1rem;
      min-height: 100%;           /* Hauteur au moins égale au parent */
      height: auto;
      overflow-y: auto;           /* Scroll si contenu trop long */
      position: relative;
    }

    /* --- Colonne droite (vidéo + étapes) --- */
    .right-half {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    /* Étiquette "Les Modes Opératoires" en haut à gauche */
    .top-label {
      margin: 0;
      padding: 8px 8px;
      display: inline-block;
      color: #ffffff;
      font-weight: bold;
    }
    
    /* Bouton du dropdown (sélection de gamme) */
    .custom-dropdown-btn { 
      background-color: #006fa5; 
      color: white; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Menu déroulant personnalisé */
    .custom-dropdown-menu { 
      background-color: #0686c7; 
      color: white; 
    }
    .custom-dropdown-menu .dropdown-item { 
      color: white; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .custom-dropdown-menu .dropdown-item:hover {
      background-color: #006fa5;
    }
    
    /* Carte représentant un servomoteur */
    .servo {
      background-color: #1E3459;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    
    /* Icônes principales des servos */
    .icon { 
      width: 80px; 
      height: auto;
      max-width: 100%;
    }
    /* Icônes des numéros d'étapes (petites) */
    .partie { 
      width: 55px; 
      padding: 0%; 
      height: auto;
      max-width: 100%;
    }
    
    /* Mise en page horizontale pour les cartes */
    .card-horizontal { 
      display: flex; 
      align-items: center; 
      flex-wrap: wrap;
    }
    .card-horizontal .icon { 
      margin-right: 1rem; 
      flex-shrink: 0;
    }
    
    /* Élément de liste des servos (quand utilisé dans une liste) */
    .list-group-item.servo {
      background-color: #1E3459;
      border: 1px solid #496791;
      color: white;
    }
    
    /* Badge pour les étapes */
    .badge { 
      font-size: 0.85em; 
      padding: 0.4em 0.7em; 
      text-align: left;
      word-break: break-word;
      white-space: normal;
      flex: 1;
    }
    
    /* Adaptation mobile : réduction des icônes */
    @media (max-width: 768px) {
      .card-horizontal { 
        flex-direction: row; 
        text-align: left; 
      }
      .card-horizontal .icon { 
        margin: 0 1rem 0 0; 
        width: 60px;
      }
    }
    
    /* Effet au survol des cartes servos */
    .card-horizontal:hover { 
      background-color: #0686c7; 
    }

    /* Élément de la liste des étapes (colonne droite) */
    .list-group-item.etapes {
      background-color: #1E3459;
      color: white;
      cursor: pointer;
      white-space: normal;     
      word-wrap: break-word;    
      text-align: left;        
      display: flex;
      align-items: center;
      transition: all 0.2s ease;
    }
    .list-group-item.etapes:hover {
      background-color: #0686c7;
      color: white;
    }

    /* Suppression des marges/paddings par défaut sur le conteneur principal */
    .container-fluid { 
      padding: 0;
      margin: 0;
    }
    
    /* Style pour le servo sélectionné (bordure blanche à gauche) */
    .servo.selected {
      border-left: 5px solid #ffffff;
      background-color: #021f44;
    }
    
    /* Étape active dans la liste des étapes */
    .etapes.active-step {
      background-color: #124a70;
      border-left: 5px solid #ffffff;
    }
    
    /* Carte contenant la liste des étapes (colonne droite) */
    .step-card {
      background-color: #1E3459;
      color: white;
      overflow-y: auto;
      max-height: 40vh;
      transition: all 0.3s ease;
    }
    
    /* Ajustements pour les écrans moyens et plus */
    @media (min-width: 768px) {
      .equal-row {
        align-items: stretch;
      }
      .step-card {
        margin-bottom: 0;
      }
    }
    
    /* Logo en bas centré */
    .footer-logo {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.3);
      padding: 8px 15px;
      border-radius: 8px;
    }
    .footer-logo img {
      max-height: 60px;
      max-width: 30vw;
      opacity: 0.9;
    }
    /* Cacher le logo sur très petits écrans */
    @media (max-width: 500px) {
      .footer-logo { 
        display: none; 
      }
    }
    
    /* Conteneur vidéo responsive */
    .video-container {
      margin-top: 1rem;
      width: 100%;
    }
    
    /* Conteneur pour le badge + numéro d'étape */
    .step-badge-container {
      display: flex;
      align-items: center;
      width: 100%;
    }
    
    .step-number {
      flex-shrink: 0;
      margin-right: 0.5rem;
    }
    
    .card-content {
      flex: 1;
      min-width: 0;
    }
    
    /* Règles d'adaptation supplémentaires sur petits écrans */
    @media (max-width: 576px) {
      .left-half {
        min-height: auto;
        max-height: none;
      }
      .icon {
        width: 60px;
      }
      .card-horizontal {
        padding: 0.5rem;
      }
      .card-title {
        font-size: 1rem;
      }
      .card-text {
        font-size: 0.9rem;
      }
      .step-card {
        max-height: 35vh;
      }
      .badge {
        font-size: 0.8rem;
      }
    }
    
    @media (max-width: 360px) {
      .icon {
        width: 50px;
      }
      .partie {
        width: 40px;
      }
      .card-horizontal .icon {
        margin-right: 0.5rem;
      }
    }
    
    /* Message d'instruction lorsqu'aucune gamme n'est sélectionnée */
    .instruction-message {
      text-align: center;
      padding: 2rem;
      color: #8ba3c7;
      font-style: italic;
    }
    
    /* Conteneur des étapes d'un servo (dépliable) */
    .servo-steps-container {
      width: 100%;
      margin-top: 0.5rem;
      max-height: 0;
      overflow: hidden;
      border-top: 1px solid transparent;
      padding-top: 0;
      transition: all 0.3s ease;
      opacity: 0;
    }
    
    .servo-steps-container.show {
      max-height: none;        /* Déroulé : hauteur automatique */
      border-top: 1px solid #496791;
      padding-top: 0.5rem;
      opacity: 1;
    }
    
    /* Chaque étape dans le dépliable (affichage compact) */
    .servo-step-item {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      margin-bottom: 0.25rem;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 0.25rem;
      word-break: break-word;
      white-space: normal;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .servo-step-item:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    
    .servo-step-item.active {
      background-color: #0686c7;
    }
    
    .servo-step-number {
      display: inline-block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      text-align: center;
      line-height: 20px;
      margin-right: 0.5rem;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    
    .servo-step-content {
      display: flex;
      align-items: flex-start;
    }
    
    .servo-step-time {
      font-size: 0.65rem;
      color: #8ba3c7;
      margin-left: auto;
      padding-left: 0.5rem;
      flex-shrink: 0;
    }
    
    /* Bouton pour dérouler/rouler les étapes d'un servo */
    .toggle-steps-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      transition: transform 0.3s ease;
      margin-left: auto;
    }
    
    .toggle-steps-btn.rotated {
      transform: rotate(180deg);
    }
    
    .toggle-steps-btn:hover {
      color: #cccccc;
    }
    
    .card-header-content {
      display: flex;
      align-items: center;
      width: 100%;
    }
    
    /* Responsive pour les étapes dépliables */
    @media (max-width: 768px) {
      .servo-step-item {
        font-size: 0.7rem;
        padding: 0.2rem 0.4rem;
      }
      .servo-step-number {
        width: 18px;
        height: 18px;
        line-height: 18px;
        font-size: 0.65rem;
      }
      .servo-step-time {
        font-size: 0.6rem;
      }
      .toggle-steps-btn {
        font-size: 1rem;
      }
    }

    /* Panneau des outils (fixé en bas à gauche, visible sur demande) */
    .tools-panel {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 50%;
      background-color: #1E3459;
      border: 2px solid #0686c7;
      border-radius: 10px;
      padding: 20px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: none;
      margin: 0 1rem;
      box-sizing: border-box;
    }
    
    .tools-panel.show {
      display: block;
      animation: slideInUp 0.3s ease;
    }
    
    /* Animation d'apparition du panneau */
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .tools-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #496791;
    }
    
    .tools-title {
      font-weight: bold;
      color: #ffffff;
      margin: 0;
      font-size: 1.1rem;
    }
    
    .close-tools-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tools-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    
    .tool-item {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      display: flex;
      align-items: center;
    }
    
    .tool-icon {
      width: 28px;
      height: 28px;
      margin-right: 12px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      overflow: hidden;
      padding:3px;
    }
    
    .tool-icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    
    .tool-name {
      font-size: 0.95rem;
      color: #ffffff;
    }
    
    /* Adaptation mobile du panneau outils */
    @media (max-width: 768px) {
      .tools-panel {
        left: 10px;
        right: 10px;
        width: auto;
        bottom: 10px;
        margin: 0;
      }
      .tools-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- ==================== STRUCTURE PRINCIPALE ==================== -->
  <div class="container-fluid m-0 p-2 p-md-3">
    <div class="row g-0 g-md-3 equal-row">
      
      <!-- COLONNE GAUCHE : Sélection de gamme + liste des servomoteurs -->
      <div class="col-12 col-md-6 left-half">
        <p class="top-label">Les Modes Opératoires</p>
        
        <!-- Menu déroulant pour choisir une gamme -->
        <div class="dropdown mt-3 w-100">
          <button id="dropdownButton" class="btn custom-dropdown-btn dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            SÉLECTIONNEZ UNE GAMME
          </button>
          <ul class="dropdown-menu custom-dropdown-menu w-100">
            <li><a class="dropdown-item" href="#">BT-RANGE</a></li>
            <li><a class="dropdown-item" href="#">ST-RANGE</a></li>
            <li><a class="dropdown-item" href="#">AQ-RANGE</a></li>
            <li><a class="dropdown-item" href="#">L-RANGE</a></li>
            <li><a class="dropdown-item" href="#">SN-RANGE</a></li>
            <li><a class="dropdown-item" href="#">DR-RANGE</a></li>
            <li><a class="dropdown-item" href="#">μCONTACTS-RANGE</a></li>
          </ul>
        </div>
        
        <!-- Conteneur dynamique des cartes servomoteurs -->
        <div id="card-container" class="mt-3">
          <div class="instruction-message">
            Veuillez sélectionner une gamme pour afficher les servomoteurs disponibles.
          </div>
        </div>

        <!-- Panneau des outils (initialement masqué) -->
        <div id="tools-panel" class="tools-panel">
          <div class="tools-header">
            <h6 class="tools-title">Outils nécessaires</h6>
            <button id="close-tools-btn" class="close-tools-btn">×</button>
          </div>
          <ul class="tools-list" id="tools-list">
            <!-- La liste des outils sera générée dynamiquement -->
          </ul>
        </div>
      </div>
      
      <!-- COLONNE DROITE : Vidéo + étapes -->
      <div class="col-12 col-md-6 right-half">
        <div class="container mt-2 mt-md-0 p-0 p-md-2 d-flex flex-column h-100" id="fullscreen-container">
          <!-- Lecteur vidéo (ratio 16/9) -->
          <div class="ratio ratio-16x9 video-container">
            <video id="video-player" controls class="w-100">
              <source id="video-source" src="" type="video/mp4">
              Votre navigateur ne supporte pas la balise vidéo.
            </video>
          </div>
          
          <!-- Carte affichant la liste des étapes de la réalisation -->
          <div class="card m-1 m-md-3 step-card">
            <div class="card-body p-2 p-md-3">
              <div class="d-flex align-items-center justify-content-between mb-2 mb-md-3">
                <h5 class="card-title mb-0 d-flex align-items-center">
                  <img class="icon me-2" src="HMTL_JS/icons/footstep.png" alt="Étapes">
                  <span class="d-none d-md-inline">Les Étapes de Réalisations</span>
                  <span class="d-md-none">Étapes</span>
                </h5>
                <!-- Bouton pour passer le conteneur en plein écran -->
                <button id="fullscreen-btn" class="btn btn-outline-light btn-sm ms-3">Plein écran</button>
              </div>
              <!-- Conteneur des étapes (généré dynamiquement) -->
              <div class="list-group list-group-flush" id="etapes-container"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap JS (pour le dropdown, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ==================== SCRIPT PRINCIPAL (DONNÉES & INTERACTIONS) ==================== -->
  <script>
    // ========== 1. DONNÉES STATIQUES : Toutes les gammes, servos, étapes, vidéos, outils ==========
    const data = {
      "BT-RANGE": [
        { 
          title: "BT6L",

      ],
      "L-RANGE": [
        { 
          title: "100L", text: "Démontage", img: "HMTL_JS/img/L/100LL.png", video: "videos/demontage_100l.mp4", steps: [

    // ========== 2. RÉFÉRENCES AUX ÉLÉMENTS DU DOM ==========
    const dropdownItems = document.querySelectorAll(".dropdown-item");
    const dropdownButton = document.getElementById("dropdownButton");
    const container = document.getElementById("card-container");
    const etapesContainer = document.getElementById("etapes-container");
    const videoPlayer = document.getElementById("video-player");
    const videoSource = document.getElementById("video-source");
    const fullscreenBtn = document.getElementById("fullscreen-btn");
    const fullscreenContainer = document.getElementById("fullscreen-container");
    const toolsPanel = document.getElementById("tools-panel");
    const toolsList = document.getElementById("tools-list");
    const closeToolsBtn = document.getElementById("close-tools-btn");

    // ========== 3. FONCTIONS UTILITAIRES ==========
    // Convertit des secondes en format MM:SS
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // Affiche le panneau des outils pour une étape donnée
    function showToolsForStep(tools, stepLabel) {
      const toolsTitle = toolsPanel.querySelector('.tools-title');
      toolsTitle.textContent = `Outils pour: ${stepLabel}`;
      
      toolsList.innerHTML = '';
      
      tools.forEach(tool => {
        const toolItem = document.createElement('li');
        toolItem.className = 'tool-item';
        
        let iconHTML;
        if (tool.icon) {
          iconHTML = `<div class="tool-icon"><img class="tool-icon-img" src="${tool.icon}" alt="${tool.name}"></div>`;
        } else {
          iconHTML = `<div class="tool-icon">🛠️</div>`;
        }
        
        toolItem.innerHTML = `
          ${iconHTML}
          <span class="tool-name">${tool.name || tool}</span>
        `;
        toolsList.appendChild(toolItem);
      });
      
      toolsPanel.classList.add('show');
    }

    // Masque le panneau des outils
    function hideToolsPanel() {
      toolsPanel.classList.remove('show');
    }

    // ========== 4. MISE À JOUR DE LA COLONNE GAUCHE (CARTES SERVOS) ==========
    function updateCards(range) {
      // Supprimer le message d'instruction s'il existe
      const instructionMessage = document.querySelector('.instruction-message');
      if (instructionMessage) {
        instructionMessage.remove();
      }
      
      container.innerHTML = ""; // Vide le conteneur
      data[range]?.forEach((card, index) => {
        const cardHTML = `
          <div class="card m-2 m-md-3 servo" data-index="${index}" data-range="${range}">
            <div class="card-body p-2">
              <div class="card-header-content">
                <div class="d-flex align-items-center flex-grow-1">
                  <img class="icon" src="${card.img}" alt="${card.title}">
                  <div class="card-content ms-2">
                    <h5 class="card-title m-1">${card.title}</h5>
                    <p class="card-text mb-0">${card.text}</p>
                  </div>
                </div>
                <button class="toggle-steps-btn" type="button">▼</button>
              </div>
              <div class="servo-steps-container">
                ${card.steps.map((step, idx) => `
                  <div class="servo-step-item" data-time="${step.time}" data-tools='${JSON.stringify(step.tools)}' data-label="${step.label}">
                    <div class="servo-step-content">
                      <span class="servo-step-number">${idx + 1}</span>
                      <span class="servo-step-label">${step.label}</span>
                      <span class="servo-step-time">${formatTime(step.time)}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>`;
        container.insertAdjacentHTML("beforeend", cardHTML);
      });
      attachCardEvents(range);
    }

    // Attache les événements aux cartes servos (déroulement des étapes, clic sur étape, sélection du servo)
    function attachCardEvents(range) {
      document.querySelectorAll(".servo").forEach(card => {
        const toggleBtn = card.querySelector('.toggle-steps-btn');
        const stepsContainer = card.querySelector('.servo-steps-container');
        const stepItems = card.querySelectorAll('.servo-step-item');
        
        // Bouton pour dérouler/rouler les étapes du servo
        toggleBtn.addEventListener('click', function(e) {
          e.stopPropagation(); 
          stepsContainer.classList.toggle('show');
          this.classList.toggle('rotated');
        });
        
        // Clic sur une étape dans le déroulé : synchronisation vidéo + outils
        stepItems.forEach(stepItem => {
          stepItem.addEventListener('click', function(e) {
            e.stopPropagation(); 
            
            stepItems.forEach(item => item.classList.remove('active'));
            this.classList.add('active');
            
            const time = parseFloat(this.getAttribute('data-time'));
            const tools = JSON.parse(this.getAttribute('data-tools'));
            const stepLabel = this.getAttribute('data-label');
            
            videoPlayer.currentTime = time;
            videoPlayer.play();
            
            showToolsForStep(tools, stepLabel);
            
            updateRightPanelSelection(time);
          });
        });
        
        // Clic sur la carte elle-même (sélection du servo) : charge la vidéo et les étapes principales
        card.addEventListener("click", (e) => {
          if (e.target.closest('.toggle-steps-btn') || e.target.closest('.servo-step-item')) {
            return;
          }
          
          document.querySelectorAll(".servo").forEach(c => c.classList.remove("selected"));
          card.classList.add("selected");

          const index = card.getAttribute("data-index");
          const item = data[range][index];

          videoSource.src = item.video;
          videoPlayer.load();
          videoPlayer.play();

          updateRightPanel(item.steps);
        });
      });
    }

    // ========== 5. MISE À JOUR DU PANNEAU DROIT (LISTE DES ÉTAPES) ==========
    function updateRightPanel(steps) {
      etapesContainer.innerHTML = "";
      steps.forEach((step, idx) => {
        const stepElement = document.createElement("div");
        stepElement.className = "list-group-item etapes d-flex justify-content-start align-items-center py-2 mb-2";
        stepElement.innerHTML = `
          <div class="step-badge-container">
            <span class="step-number"><img class="partie" src="HMTL_JS/icons/${idx + 1}.png" alt="Étape ${idx + 1}"></span>
            <span class="badge bg-none">${step.label}</span>
          </div>
        `;
        stepElement.addEventListener("click", () => {
          document.querySelectorAll(".etapes").forEach(el => el.classList.remove("active-step"));
          stepElement.classList.add("active-step");
          videoPlayer.currentTime = step.time;
          videoPlayer.play();
          
          showToolsForStep(step.tools, step.label);
        });
        etapesContainer.appendChild(stepElement);
      });
    }

    // Met à jour la sélection visuelle dans le panneau droit (utilisé lors du clic sur une étape déroulée)
    function updateRightPanelSelection(time) {
      document.querySelectorAll(".etapes").forEach((el, idx) => {
        el.classList.remove("active-step");
      });
    }

    // ========== 6. GESTION DES ÉVÉNEMENTS GLOBAUX ==========
    // Sélection d'une gamme dans le menu déroulant
    dropdownItems.forEach(item => {
      item.addEventListener("click", (e) => {
        e.preventDefault();
        const selected = item.textContent.trim();
        dropdownButton.textContent = selected;
        updateCards(selected);
      });
    });

    // Plein écran du conteneur vidéo + étapes
    fullscreenBtn.addEventListener("click", () => {
      if (fullscreenContainer.requestFullscreen) {
        fullscreenContainer.requestFullscreen();
      } else if (fullscreenContainer.webkitRequestFullscreen) {
        fullscreenContainer.webkitRequestFullscreen();
      } else if (fullscreenContainer.mozRequestFullScreen) {
        fullscreenContainer.mozRequestFullScreen();
      } else if (fullscreenContainer.msRequestFullscreen) {
        fullscreenContainer.msRequestFullscreen();
      }
    });

    // Fermeture du panneau des outils
    closeToolsBtn.addEventListener("click", hideToolsPanel);

    // Détection du mode plein écran pour repositionner la carte des étapes
    function isFullscreen() {
      return document.fullscreenElement === fullscreenContainer
        || document.webkitFullscreenElement === fullscreenContainer
        || document.mozFullScreenElement === fullscreenContainer
        || document.msFullscreenElement === fullscreenContainer;
    }

    function toggleStepCardFullscreen() {
      const stepCard = document.querySelector('.step-card');
      const paused = videoPlayer.paused;
      if (isFullscreen() && paused) {
        stepCard.style.position = 'absolute';
        stepCard.style.bottom = '10px';
        stepCard.style.left = '10px';
        stepCard.style.right = '10px';
        stepCard.style.maxHeight = '40vh';
        stepCard.style.backgroundColor = 'rgba(30, 52, 89, 0.85)';
        stepCard.style.zIndex = '9999';
      } else {
        stepCard.style = '';
      }
    }

    videoPlayer.addEventListener('pause', toggleStepCardFullscreen);
    videoPlayer.addEventListener('play', toggleStepCardFullscreen);
    document.addEventListener('fullscreenchange', toggleStepCardFullscreen);
  </script>

  <div class="footer-logo">
    <img src="HMTL_JS/icons/logo_bc.png" alt="Logo" />
  </div>
</body>
